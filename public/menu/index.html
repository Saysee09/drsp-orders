<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DRSP Homemade Pickles — Menu</title>
  <meta name="description" content="Fresh, authentic, homemade pickles. See our menu and order on WhatsApp." />
  <!-- WhatsApp / social link preview: shows the menu photo in the chat -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DRSP Homemade Pickles — Menu 🏺" />
  <meta property="og:description" content="Fresh, authentic, homemade pickles. Tap to see the full menu & prices." />
  <meta property="og:image" content="https://saysee09.github.io/drsp-orders/menu/menu.jpg" />
  <meta property="og:url" content="https://saysee09.github.io/drsp-orders/menu/" />
  <link rel="icon" href="../icons/icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #fff; }
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    header img { width: 48px; height: 48px; border-radius: 12px; }
    h1 { font-size: 22px; margin: 0; font-weight: 900; }
    p.sub { margin: 2px 0 0; color: #94a3b8; font-size: 14px; }
    .menu { width: 100%; border-radius: 16px; background: #fff; display: block; }
    .btns { display: grid; gap: 10px; margin-top: 16px; }
    a.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; font-weight: 800; font-size: 17px; text-decoration: none; }
    .wa { background: #25d366; color: #052e16; }
    .pdf { background: #1e293b; color: #fff; border: 1px solid #334155; }
    .missing { padding: 40px 16px; text-align: center; color: #94a3b8; background: #1e293b; border-radius: 16px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../icons/icon-192.png" alt="" />
      <div>
        <h1 id="biz">DRSP Homemade Pickles</h1>
        <p class="sub">Fresh, authentic, homemade pickles 🏺</p>
      </div>
    </header>
    <img class="menu" id="menuImg" src="menu.jpg" alt="DRSP pickles menu with prices" onerror="this.outerHTML='<div class=missing>Menu photo coming soon.</div>'" />
    <div class="btns">
      <a class="btn wa" id="order" href="#" style="display:none">💬 Order on WhatsApp</a>
      <a class="btn pdf" id="pdf" href="menu.pdf" download="DRSP-Menu.pdf" style="display:none">📄 Download menu (PDF)</a>
    </div>
  </main>
  <script>
    fetch('menu.pdf', { method: 'HEAD' }).then(function (r) {
      if (r.ok && (r.headers.get('content-type') || '').indexOf('html') === -1) document.getElementById('pdf').style.display = 'flex';
    }).catch(function () {});
    fetch('../config.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
      if (c.businessName) { document.getElementById('biz').textContent = c.businessName; document.title = c.businessName + ' — Menu'; }
      var p = String(c.businessPhone || '').replace(/\D/g, '').replace(/^(91|0)(?=[6-9]\d{9}$)/, '');
      if (/^[6-9]\d{9}$/.test(p)) {
        var a = document.getElementById('order');
        a.href = 'https://wa.me/91' + p + '?text=' + encodeURIComponent('Hi! I saw your menu and would like to order:');
        a.style.display = 'flex';
      }
    }).catch(function () {});
  </script>
</body>
</html>
